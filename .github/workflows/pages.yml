name: Build and publish Pages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Site URL configuration
        type: choice
        options: [preview, production]
        default: preview
        required: true
      publish:
        description: Publish the validated site to GitHub Pages
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  APMY_PAGES_PREVIEW: ${{ inputs.target == 'preview' && '1' || '0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify:artifact
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
